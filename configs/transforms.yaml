# Transformações (M2). Lidas por src/skinlesion/data.py → build_transforms(cfg, task, split).
# Regra: validação/teste só redimensiona/recorta ao centro e normaliza. Augmentation só no treino.
# Cada augmentation tem uma justificativa; nada entra "porque sim".
version: v1
normalize:                       # média/desvio do ImageNet — obrigatório com pesos pré-treinados
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

classification:
  input_size: 224
  train:
    # Geometria — lesões não têm orientação canônica: rotação/flip são "grátis" e seguros
    - {name: RandomResizedCrop, size: [224, 224], scale: [0.7, 1.0], ratio: [0.9, 1.1], p: 1.0}
    - {name: HorizontalFlip, p: 0.5}
    - {name: VerticalFlip, p: 0.5}
    - {name: Rotate, limit: 180, border_mode: reflect, p: 0.7}
    # Fotometria leve — compensa variação de aparelho/iluminação entre centros; limites baixos para não
    # destruir cor, que é sinal diagnóstico (ex.: azul-acinzentado em MEL, vermelho em VASC)
    - {name: ColorJitter, brightness: 0.15, contrast: 0.15, saturation: 0.10, hue: 0.02, p: 0.5}
    # Artefatos — hipótese do risco 1: forçar a rede a não depender de canto escuro/borda
    - {name: CoarseDropout, num_holes_range: [1, 3], hole_height_range: [16, 48], hole_width_range: [16, 48], fill: 0, p: 0.3}
  eval:
    - {name: Resize, height: 256, width: 341}   # já está assim em data/processed; no-op de segurança
    - {name: CenterCrop, height: 224, width: 224}

segmentation:
  input_size: 256
  train:
    - {name: HorizontalFlip, p: 0.5}
    - {name: VerticalFlip, p: 0.5}
    - {name: RandomRotate90, p: 0.5}
    - {name: ShiftScaleRotate, shift_limit: 0.05, scale_limit: 0.15, rotate_limit: 30, border_mode: reflect, p: 0.6}
    - {name: ColorJitter, brightness: 0.15, contrast: 0.15, saturation: 0.10, hue: 0.02, p: 0.5}
  eval:
    - {name: Resize, height: 256, width: 256}
