name: baseline
descricao: ResNet-18 pré-treinada no ImageNet, fine-tuning de todas as camadas, CE
  ponderada por classe
model:
  arch: resnet18
  pretrained: true
  dropout: 0.2
loss:
  name: ce
  class_weights: data/splits/class_weights_v1.json
optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.0001
scheduler: cosine
batch_size: 32
epochs: 25
num_workers: 4
seed: 42
selection_metric: macro_f1
